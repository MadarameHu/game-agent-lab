<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160"><defs>
<marker id="main" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="repair" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#bd7d29" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="retry" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8271ad" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="data" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#5d8b85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#27384e}.title{font-size:35px;font-weight:700}.subtitle{font-size:19px;fill:#69788a}.heading{font-size:23px;font-weight:650}.body{font-size:18px;fill:#53647a}.small{font-size:16px;fill:#69788a}.number{font-size:15px;font-weight:700;letter-spacing:2px;fill:#8293a8}.label{font-size:19px;font-weight:600}</style><rect width="1800" height="1160" fill="#f7f9fc"/>
<text x="60" y="65" class="title">可验证游戏开发与修复框架</text>
<text x="60" y="102" class="subtitle">Agentic Game Development · 主流程从左向右，修复走上方，验证重试走下方</text>
<rect x="40" y="150" width="1720" height="600" rx="24" fill="#edf2f8" stroke="#d4dfeb" stroke-width="1.5"/>
<text x="72" y="194" class="heading">Harness</text>
<text x="210" y="193" class="subtitle">管理工程快照、工具调用、预算、状态与全程日志</text>
<rect x="80" y="365" width="240" height="205" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="102" y="396" class="number">01</text>
<text x="102" y="430" class="heading">输入与初始化</text>
<text x="102" y="468" class="body">引擎 · 初始工程 · 素材</text>
<text x="102" y="496" class="body">task_seed / 正式需求</text>
<text x="102" y="524" class="body">运行配置与随机种子</text>
<rect x="360" y="365" width="240" height="205" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="382" y="396" class="number">02</text>
<text x="382" y="430" class="heading">任务与验收定义</text>
<text x="382" y="468" class="body">目标行为与保留约束</text>
<text x="382" y="496" class="body">校验基线与检查器</text>
<text x="382" y="524" class="body">冻结验收规格与预算</text>
<rect x="640" y="365" width="240" height="205" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="662" y="396" class="number">03</text>
<text x="662" y="430" class="heading">执行 Agent</text>
<text x="662" y="468" class="body">读取、修改代码与场景</text>
<text x="662" y="496" class="body">调用工具，保存候选</text>
<text x="662" y="524" class="body">根据证据诊断与纠错</text>
<rect x="920" y="365" width="240" height="205" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="942" y="396" class="number">04</text>
<text x="942" y="430" class="heading">验证与奖励</text>
<text x="942" y="468" class="body">执行检查，保存证据</text>
<text x="942" y="496" class="body">通过 / 失败 / 无法判定</text>
<text x="942" y="524" class="body">有效判定 → reward</text>
<rect x="1200" y="365" width="240" height="205" rx="16" fill="#fff9ef" stroke="#e7d4ae" stroke-width="1.5"/>
<text x="1222" y="396" class="number">05</text>
<text x="1222" y="430" class="heading">循环决策</text>
<text x="1222" y="468" class="body">通过 → 提交</text>
<text x="1222" y="496" class="body">候选失败 → 修复</text>
<text x="1222" y="524" class="body">验证异常 → 排查重试</text>
<rect x="1480" y="365" width="240" height="205" rx="16" fill="#edf8f2" stroke="#bfd9cb" stroke-width="1.5"/>
<text x="1502" y="396" class="number">06</text>
<text x="1502" y="430" class="heading">提交与归档</text>
<text x="1502" y="468" class="body">工程 · 报告 · 完整轨迹</text>
<text x="1502" y="496" class="body">保存终止原因与版本</text>
<text x="1502" y="524" class="body">预算耗尽也归档状态</text>
<path d="M320 465 H352" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#main)"/>
<path d="M600 465 H632" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#main)"/>
<path d="M880 465 H912" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#main)"/>
<path d="M1160 465 H1192" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#main)"/>
<path d="M1440 465 H1472" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#main)"/>
<path d="M1280 365 V270 Q1280 254 1264 254 H756 Q740 254 740 270 V355" fill="none" stroke="#bd7d29" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#repair)"/>
<text x="790" y="239" class="label" style="fill:#bd7d29">候选失败且有预算：诊断 → 修复</text>
<text x="790" y="285" class="small">沿用同一版验收规格</text>
<path d="M1340 570 V650 Q1340 666 1324 666 H1056 Q1040 666 1040 650 V580" fill="none" stroke="#8271ad" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry)"/>
<text x="1065" y="644" class="label" style="fill:#8271ad">验证异常：先排查工具 / 环境</text>
<text x="1065" y="699" class="small">有上限重试；工具故障不直接计为候选失败</text>
<text x="1498" y="611" class="small">通过或达到终止条件</text>
<text x="80" y="627" class="label">验证工具按需选择</text>
<text x="80" y="661" class="body">程序检查 / 引擎执行 / 多模态辅助 / 必要人工</text>
<text x="80" y="695" class="small">证据、判定与奖励分别保存；执行 Agent 不得修改裁判。</text>
<text x="60" y="814" class="heading">数据与训练接口</text>
<text x="285" y="814" class="subtitle">跨 episode 更新策略；评测时固定模型、预算与经验库</text>
<rect x="80" y="866" width="340" height="148" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="104" y="904" class="heading">轨迹与经验</text>
<text x="104" y="939" class="body">各阶段持续记录成功 / 失败轨迹</text>
<text x="104" y="966" class="body">验证后筛选可复用经验</text>
<rect x="520" y="866" width="340" height="148" rx="16" fill="#f2f0fa" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="544" y="904" class="heading">Agentic RL 训练器</text>
<text x="544" y="939" class="body">动作、观察与有效奖励</text>
<text x="544" y="966" class="body">采集 episode，更新模型参数</text>
<rect x="960" y="866" width="340" height="148" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="984" y="904" class="heading">策略版本</text>
<text x="984" y="939" class="body">保存模型版本与训练配置</text>
<text x="984" y="966" class="body">固定 harness，比较模型能力</text>
<rect x="1400" y="866" width="320" height="148" rx="16" fill="#fff" stroke="#d3ddeb" stroke-width="1.5"/>
<text x="1424" y="904" class="heading">下一次任务运行</text>
<text x="1424" y="939" class="body">加载新策略，进入阶段 01</text>
<text x="1424" y="966" class="body">训练器位于 harness 外部</text>
<path d="M420 940 H510" fill="none" stroke="#5d8b85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#data)"/>
<path d="M860 940 H950" fill="none" stroke="#5d8b85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#data)"/>
<path d="M1300 940 H1390" fill="none" stroke="#5d8b85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#data)"/>
<text x="60" y="1071" class="body">人工参与：验收歧义、检查器校准、主观体验与抽样审查；候选失败和验证异常分别处理。</text>
<text x="60" y="1122" class="small">框架草案 v1.1 · 2026-09-20 · 实线：任务执行与返回路径；虚线：训练数据与策略流转。设计接口不表示已实现。</text>
</svg>